name: Build, test and publish

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect change scope
        id: scope
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "content_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git rev-parse HEAD^ >/dev/null 2>&1; then
            echo "content_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed="$(git diff --name-only HEAD^ HEAD)"
          echo "Changed files:"
          printf '%s\n' "$changed"

          if [[ -n "$changed" ]] && ! printf '%s\n' "$changed" | grep -qvE '^docs/data/[^/]+\.json$'; then
            echo "content_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "content_only=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate content JSON
        shell: bash
        run: |
          python3 - <<'PY'
          import glob
          import json
          import sys

          files = sorted(glob.glob("docs/data/*.json"))
          if not files:
              raise SystemExit("No JSON content files found in docs/data/")

          required_production = {
              "id": int,
              "badge": str,
              "title": str,
              "subtitle": str,
              "preview": str,
              "content": str,
          }

          for path in files:
              with open(path, encoding="utf-8") as handle:
                  data = json.load(handle)

              exercise = data.get("exercise")
              productions = data.get("productions")

              if not isinstance(exercise, dict):
                  raise ValueError(f"{path}: missing object 'exercise'")
              for key in ("title", "statement"):
                  if not isinstance(exercise.get(key), str):
                      raise ValueError(f"{path}: exercise.{key} must be a string")

              if not isinstance(productions, list) or not productions:
                  raise ValueError(f"{path}: 'productions' must be a non-empty list")

              ids = set()
              badges = set()
              for index, production in enumerate(productions):
                  if not isinstance(production, dict):
                      raise ValueError(f"{path}: productions[{index}] must be an object")
                  for key, expected_type in required_production.items():
                      if not isinstance(production.get(key), expected_type):
                          raise ValueError(
                              f"{path}: productions[{index}].{key} must be {expected_type.__name__}"
                          )

                  if production["id"] in ids:
                      raise ValueError(f"{path}: duplicate production id {production['id']}")
                  if production["badge"] in badges:
                      raise ValueError(f"{path}: duplicate production badge {production['badge']}")
                  ids.add(production["id"])
                  badges.add(production["badge"])

              print(f"{path}: OK ({len(productions)} productions)")
          PY

      - name: Publish content only
        if: steps.scope.outputs.content_only == 'true'
        shell: bash
        run: |
          mkdir -p docs/site/data
          cp docs/data/*.json docs/site/data/

      - uses: actions/setup-node@v4
        if: steps.scope.outputs.content_only != 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        if: steps.scope.outputs.content_only != 'true'
        run: npm --prefix docs ci

      - name: Validate survey bank and session logic
        if: steps.scope.outputs.content_only != 'true'
        run: |
          python3 docs/scripts/build-bank.py
          node docs/scripts/validate-bank.cjs
          node docs/scripts/test-survey.cjs

      - name: Run Elm logic tests
        if: steps.scope.outputs.content_only != 'true'
        run: npm --prefix docs run test:logic

      - name: Compile Elm
        if: steps.scope.outputs.content_only != 'true'
        run: npm --prefix docs run build:main

      - name: Install Playwright browsers
        if: steps.scope.outputs.content_only != 'true'
        run: npm --prefix docs run test:e2e:install:ci

      - name: Run browser interaction tests
        if: steps.scope.outputs.content_only != 'true'
        run: npm --prefix docs run test:e2e

      - name: Save browser checks
        if: always() && steps.scope.outputs.content_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: browser-checks
          path: docs/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Configure Pages
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload site
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site

  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
